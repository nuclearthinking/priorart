[project]
name = "priorart"
version = "0.1.0"
description = "Local agentic code search: find existing symbols before writing new code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
    "sqlite-vec>=0.1.6",
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-language-pack>=0.7",
    "typer>=0.12",
]

[project.scripts]
priorart = "priorart.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priorart"]

[tool.ruff]
line-length = 100
target-version = "py312"
