[project]
name = "priorart"
version = "0.1.0"
description = "Local agentic code search: find existing symbols before writing new code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.2",
    "pydantic-settings>=2.15.0",
    "sqlite-vec>=0.1.6",
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-language-pack>=0.7",
    "typer>=0.12",
]

[project.scripts]
priorart = "priorart.cli:main"

[dependency-groups]
dev = [
    "diff-cover>=10.5.1",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-gremlins>=1.9.0",
    "ruff>=0.6",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priorart"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FAST",
    "FBT",
    "FIX",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T10",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "ISC001",
    "ISC002",
    "PLC0415",
    "PLR2004",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "RUF001",
    "RUF002",
    "RUF003",
    "S101",
    "S105",
    "S106",
    "S107",
    "S311",
    "TRY003",
    "W191",
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["INP001", "S603", "S607"]

[tool.vulture]
paths = ["src/priorart"]
min_confidence = 60
sort_by_size = true
